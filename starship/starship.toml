# Starship prompt — https://starship.rs/config/
# Fast, informative two-line prompt: path · git · language versions.

add_newline = true
command_timeout = 1000

format = """
[](surface0)\
$directory\
$git_branch\
$git_status\
$nodejs\
$bun\
$package\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold yellow"
conflicted = "✖"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "≡"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[nodejs]
symbol = " "
style = "bold green"
detect_files = ["package.json", ".node-version", ".nvmrc"]

[bun]
symbol = "🥟 "
style = "bold #fbf0df"

[package]
disabled = true

[cmd_duration]
min_time = 2000
format = "[ 󱎫 $duration]($style)"
style = "bold yellow"
